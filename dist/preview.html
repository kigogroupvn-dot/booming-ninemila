<title>Booming Ninemila</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Josefin+Sans:wght@400;600&family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>/* Booming Ninemila · giao diện chung (theo guideline Ninemila đã chốt) */
:root{
  --choco:#380E00; --choco-deep:#2D0800; --orange:#F16100;
  --amber-light:#F0C79C; --amber:#E8A35A; --grey:#E1DFE0; --grey-dark:#C8C6C9;
  --ink:#2a1a14; --muted:#75655d; --line:#ebe6e3; --soft:#f4f2f3; --cream:#fbf7f3; --bg:#fff;
  --nen:url(assets/nen-bia.jpg);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.65 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.label{font:600 11px/1.5 "Josefin Sans",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.money{white-space:nowrap}

/* ── Thanh trên cùng ── */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:28px 0}
.top .logo img{height:22px;display:block}
.top nav{display:flex;gap:8px;align-items:center}
.btn{font:500 13px/1 "Be Vietnam Pro";color:#fff;border:1px solid rgba(255,255,255,.7);background:transparent;padding:11px 18px;border-radius:2px;text-decoration:none;cursor:pointer;transition:.2s;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#fff;color:var(--choco)}
.btn.solid{background:#fff;color:var(--choco);border-color:#fff}
.btn.solid:hover{background:var(--amber-light);border-color:var(--amber-light)}
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 8px);background:#fff;min-width:260px;box-shadow:0 18px 40px rgba(45,8,0,.22);border-radius:2px;padding:8px 0;display:none;z-index:30}
.menu.open .menu-list{display:block}
.menu-list a{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;color:var(--choco);text-decoration:none;font-size:14px}
.menu-list a:hover{background:var(--cream)}
.menu-list a.on{font-weight:600;color:var(--orange)}
.menu-list a small{color:var(--muted);font-size:12px}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ── Bìa ── */
.cover{position:relative;color:#fff;background:var(--choco-deep);overflow:hidden}
.cover:before{content:"";position:absolute;inset:0;background:var(--nen) center/cover;opacity:.9}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(45,8,0,.95) 0%,rgba(45,8,0,.76) 50%,rgba(45,8,0,.2) 100%)}
.cover .wrap{position:relative;z-index:1}
.hero{display:grid;grid-template-columns:1fr 320px;gap:56px;align-items:end;padding:32px 0 64px}
.kicker{font:600 12px/1.4 "Josefin Sans";letter-spacing:.3em;text-transform:uppercase;color:var(--amber-light);margin-bottom:20px}
.cover h1{font:700 64px/1.04 "Philosopher",serif;letter-spacing:-.01em;margin-bottom:22px}
.cover h1 em{display:block;font-style:italic;font-weight:400;color:var(--amber-light);font-size:.62em;margin-top:8px}
.slogan{font:italic 400 24px/1.4 "Philosopher",serif;color:#fff;margin-bottom:22px;max-width:620px}
.lead{max-width:640px;color:rgba(255,255,255,.88);font-size:16px;margin-bottom:24px}
.meta{display:grid;grid-template-columns:150px 1fr;gap:10px 20px;max-width:620px;font-size:15px;color:rgba(255,255,255,.9)}
.meta dt{color:rgba(240,199,156,.9);padding-top:4px}
.product{position:relative;aspect-ratio:4/5;border:1px solid rgba(255,255,255,.85);padding:10px}
.product img{width:100%;height:100%;object-fit:cover;display:block}
.product span{position:absolute;left:-1px;bottom:22px;background:var(--orange);color:#fff;font:600 11px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;padding:9px 14px}
.crumb{font-size:13px;color:rgba(255,255,255,.75);margin-bottom:18px}
.crumb a{color:var(--amber-light);text-decoration:none}
.crumb a:hover{text-decoration:underline}
.cover.sub .hero{grid-template-columns:1fr;padding:12px 0 56px}
.cover.sub h1{font-size:52px}

/* ── Dải số cam ── */
.stats-band{background:var(--orange)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:28px 0}
.stat{border:1px solid rgba(255,255,255,.75);padding:20px 22px;color:#fff}
.stat b{display:block;font:700 34px/1.1 "Philosopher",serif;margin-bottom:8px}
.stat span{display:block;font-size:14px;line-height:1.4;font-weight:500}
.stat small{display:block;font-size:12px;opacity:.85;margin-top:4px}
.band-note{color:rgba(255,255,255,.92);font-size:12px;padding:0 0 18px;margin-top:-12px}

/* ── Section ── */
.sec{padding:88px 0 0}
.sec-head{display:grid;grid-template-columns:1fr minmax(0,420px);align-items:end;gap:32px;margin-bottom:32px}
.sec-head .label{color:var(--orange);margin-bottom:12px;display:block}
.sec-head h2{font:700 38px/1.12 "Philosopher",serif;color:var(--choco)}
.sec-head h2 em{font-style:italic;font-weight:400}
.sec-head p{color:var(--muted);font-size:14px;text-align:right}
.band{background:var(--soft);border-top:1px solid var(--grey);margin-top:0}
.band .wrap{padding-top:44px;padding-bottom:52px}
.note-line{font-size:13px;color:var(--muted);margin-top:16px}

/* ── Danh mục kế hoạch ── */
.plans{border-top:2px solid var(--choco)}
.plan{display:grid;grid-template-columns:64px 1.1fr 1.6fr 1fr 40px;gap:24px;align-items:center;padding:22px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .15s}
.plan:hover{background:var(--cream)}
.plan:hover .go{background:var(--orange);color:#fff;border-color:var(--orange)}
.plan .no{font:700 26px/1 "Philosopher",serif;color:var(--amber)}
.plan h3{font:700 22px/1.2 "Philosopher",serif;color:var(--choco)}
.plan h3 small{display:block;font:600 10px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-top:8px}
.plan p{font-size:14px;color:var(--ink)}
.plan .kpi{font:700 17px/1.3 "Philosopher",serif;color:var(--choco)}
.plan .kpi small{display:block;font:400 12px "Be Vietnam Pro";color:var(--muted)}
.go{width:38px;height:38px;border:1px solid var(--grey);border-radius:50%;display:grid;place-items:center;color:var(--choco);font-size:16px;transition:.15s}

/* ── Khối chữ / cột ── */
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.split.three{grid-template-columns:repeat(3,1fr)}
.box{border-top:2px solid var(--choco);padding:18px 0 0}
.box h3{font:700 20px/1.25 "Philosopher",serif;color:var(--choco);margin-bottom:12px}
.box h3 small{display:block;font:600 10px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.dash{list-style:none}
.dash li{position:relative;padding:7px 0 7px 18px;border-bottom:1px solid var(--line);font-size:14.5px}
.dash li:last-child{border-bottom:0}
.dash li:before{content:"";position:absolute;left:2px;top:1em;width:8px;height:2px;background:var(--orange)}
.prose p{margin-bottom:12px;max-width:820px}
.callout{background:var(--cream);border-left:3px solid var(--amber);padding:16px 20px;font-size:14px;color:var(--ink);margin-top:20px}
.callout b{color:var(--choco)}

/* ── Bảng ── */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font:600 11px/1.6 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 16px 12px 0;border-bottom:2px solid var(--choco)}
.tbl td{padding:16px 16px 16px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:600;color:var(--choco)}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td.big{font:700 18px/1.3 "Philosopher",serif;color:var(--choco)}
.tbl td small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:4px}
.tbl tr.total td{border-top:2px solid var(--choco);border-bottom:0;font-weight:700;color:var(--choco);background:var(--cream)}
.tbl tr.total td.num{font:700 18px "Philosopher",serif}
.tbl ul{list-style:none}
.tbl ul li{position:relative;padding-left:14px;margin-bottom:4px}
.tbl ul li:before{content:"";position:absolute;left:0;top:.8em;width:6px;height:1px;background:var(--orange)}
.tag{display:inline-block;font:600 10px/1 "Josefin Sans";letter-spacing:.14em;text-transform:uppercase;background:var(--orange);color:#fff;padding:5px 7px;border-radius:2px;margin-top:6px}

/* ── Ma trận IMC ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.chip{background:#fff;border:1px solid var(--grey);border-radius:999px;padding:8px 15px;font:500 13px/1 "Be Vietnam Pro";color:var(--muted);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--choco);color:var(--choco)}
.chip[aria-pressed=true]{border-color:var(--choco);background:var(--choco);color:#fff}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;margin:0 -6px;font-size:13.5px;min-width:900px}
.matrix th{font:600 11px/1.6 "Josefin Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 6px 8px;vertical-align:bottom}
.matrix th b{display:block;font:700 18px/1.2 "Philosopher",serif;letter-spacing:0;text-transform:none;color:var(--choco);margin-bottom:4px}
.matrix th span{display:block;font:400 12px/1.4 "Be Vietnam Pro";letter-spacing:0;text-transform:none}
.matrix td{background:#fff;border:1px solid var(--grey);border-radius:2px;padding:14px;vertical-align:top;width:28%}
.matrix td.row{background:none;border:0;padding:14px 8px 14px 0;width:16%;font:700 16px/1.3 "Philosopher",serif;color:var(--choco)}
.matrix td.row a{text-decoration:none}
.matrix td.row a:hover{color:var(--orange)}
.matrix td.row small{display:block;font:400 12px "Be Vietnam Pro";color:var(--muted);margin-top:4px}
.matrix td b{display:block;font-weight:600;color:var(--choco);margin-bottom:6px;font-size:14px}
.matrix td.hot{background:var(--choco);border-color:var(--choco);color:rgba(255,255,255,.9)}
.matrix td.hot b{color:var(--amber-light)}
.matrix tr.grp td{background:none;border:0;padding:22px 0 4px;font:600 11px/1.6 "Josefin Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--orange)}
.matrix tr.hide{display:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:16px;height:12px;border-radius:2px;border:1px solid var(--grey);vertical-align:-1px;margin-right:6px}
.legend i.hot{background:var(--choco);border-color:var(--choco)}

/* ── Ngân sách ── */
.totals{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-bottom:40px}
.totals > div{border:1px solid var(--grey);padding:22px 24px;background:#fff}
.totals .main{background:var(--choco);border-color:var(--choco);color:#fff}
.totals b{display:block;font:700 34px/1.1 "Philosopher",serif;color:var(--choco);margin:10px 0 8px}
.totals .main b{color:var(--amber-light);font-size:40px}
.totals .main .label{color:rgba(240,199,156,.9)}
.totals p{font-size:13px;color:var(--muted)}
.totals .main p{color:rgba(255,255,255,.8)}
.sub-h{font:700 22px/1.2 "Philosopher",serif;color:var(--choco);margin:40px 0 6px}
.sub-h + p{font-size:13.5px;color:var(--muted);margin-bottom:18px}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--choco)}
.kpis div{padding:22px 22px 6px 0;border-right:1px solid var(--line);margin-right:22px}
.kpis div:last-child{border-right:0;margin-right:0}
.kpis b{display:block;font:700 34px/1.1 "Philosopher",serif;color:var(--orange);margin-bottom:8px}
.kpis span{display:block;font-weight:600;color:var(--choco);margin-bottom:6px}
.kpis p{font-size:13.5px;color:var(--muted)}

/* ── Trang con: mục lục ── */
.layout{display:grid;grid-template-columns:220px 1fr;gap:56px;padding-top:72px}
.toc{position:sticky;top:24px;align-self:start}
.toc .label{display:block;margin-bottom:14px;color:var(--orange)}
.toc a{display:block;padding:8px 0 8px 14px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;font-size:14px;line-height:1.4}
.toc a:hover{color:var(--choco)}
.toc a.on{border-left-color:var(--orange);color:var(--choco);font-weight:600}
.content section{padding-bottom:64px;scroll-margin-top:24px}
.content h2{font:700 30px/1.15 "Philosopher",serif;color:var(--choco);margin-bottom:22px;display:flex;gap:14px;align-items:baseline}
.content h2 span{font:700 18px "Philosopher",serif;color:var(--amber)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:2px solid var(--choco);padding-top:22px}
.pager a{display:block;text-decoration:none;padding:16px 20px;border:1px solid var(--grey);transition:.15s}
.pager a:hover{border-color:var(--choco);background:var(--cream)}
.pager a.next{text-align:right}
.pager small{display:block;font:600 10px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.pager b{font:700 20px "Philosopher",serif;color:var(--choco)}

/* ── Chân trang ── */
.footer{margin-top:96px;background:var(--choco);color:rgba(255,255,255,.72);font-size:13px}
.footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:28px 32px;flex-wrap:wrap}
.footer img{height:16px;display:block}

@media (max-width:900px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding:18px 0}
  .btn{padding:9px 12px;font-size:12px}
  .btn.hide-m{display:none}
  .hero{grid-template-columns:1fr;gap:28px;padding:12px 0 40px}
  .product{max-width:240px}
  .cover h1,.cover.sub h1{font-size:40px}
  .slogan{font-size:20px}
  .cover:after{background:rgba(45,8,0,.82)}
  .meta{grid-template-columns:1fr;gap:2px}
  .meta dd{margin-bottom:10px}
  .stats{grid-template-columns:1fr 1fr;gap:10px;padding:16px 0}
  .stat{padding:14px}
  .stat b{font-size:clamp(17px,5.4vw,24px)}
  .sec{padding-top:56px}
  .sec-head{grid-template-columns:1fr;gap:10px}
  .sec-head h2{font-size:30px}
  .sec-head p{text-align:left}
  .plan{grid-template-columns:40px 1fr 32px;gap:6px 14px;padding:18px 4px}
  .plan p,.plan .kpi{grid-column:2}
  .plan .go{grid-row:1;grid-column:3;width:32px;height:32px}
  .split,.split.three,.totals{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis div{border-right:0;margin-right:0;border-bottom:1px solid var(--line);padding:18px 12px 12px 0}
  .layout{grid-template-columns:1fr;gap:0;padding-top:40px}
  .toc{display:none}
  .content h2{font-size:26px}
  .pager{grid-template-columns:1fr}
  .footer .wrap{padding:22px 16px}
}
@media print{
  .top nav,.chips,.toc{display:none !important}
  .cover:before{display:none}
  .sec,.layout{padding-top:32px}
}

/* ═════════ Khung ảnh demo ═════════ */
.slot{position:relative;max-width:100%;background:var(--grey);overflow:hidden;margin:0}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{position:absolute;inset:10px;border:1px dashed rgba(56,14,0,.28);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px;color:var(--choco);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.35) 14px 15px)}
.slot .ph b{font:700 15px/1.3 "Philosopher",serif}
.slot .ph small{font-size:12px;color:var(--muted);line-height:1.4}
.slot .ph i{position:absolute;top:12px;left:12px;font:600 9.5px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;font-style:normal;background:var(--choco);color:#fff;padding:5px 7px}
.slot .ph u{position:absolute;top:12px;right:12px;font:500 10px/1 "Be Vietnam Pro";text-decoration:none;color:var(--muted)}
.slot.has-img .ph{display:none}
.slot.dark{background:#4a2516}.slot.dark .ph{color:#fff;border-color:rgba(255,255,255,.3)}.slot.dark .ph small,.slot.dark .ph u{color:rgba(255,255,255,.7)}.slot.dark .ph i{background:var(--orange)}
figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
.cover .slot-hero{border:1px solid rgba(255,255,255,.85);padding:10px;position:relative}
.cover .slot-hero .slot{background:#5a3324}
.cover .slot-hero .slot .ph{color:#fff;border-color:rgba(255,255,255,.35)}
.cover .slot-hero .slot .ph small,.cover .slot-hero .slot .ph u{color:rgba(255,255,255,.75)}
.cover .slot-hero .tagline{position:absolute;left:-1px;bottom:22px;background:var(--orange);color:#fff;font:600 11px/1 "Josefin Sans";letter-spacing:.16em;text-transform:uppercase;padding:9px 14px;z-index:2}
.cover.sub .hero.with-media{grid-template-columns:1fr 340px;align-items:end}
.gallery{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g-wide{grid-template-columns:2fr 1fr}

/* ═════════ Threads: hai luồng ═════════ */
.streams{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--choco)}
.stream{padding:28px;display:grid;gap:18px;align-content:start}
.stream.brand{background:var(--choco);color:rgba(255,255,255,.9)}
.stream.brand h3,.stream.brand .big{color:var(--amber-light)}
.stream h3{font:700 26px/1.15 "Philosopher",serif;color:var(--choco)}
.stream .big{font:700 44px/1 "Philosopher",serif;color:var(--orange)}
.stream .big small{font:500 14px "Be Vietnam Pro";margin-left:6px}
.stream.brand .dash li{border-color:rgba(255,255,255,.14)}
.phase-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--choco)}
.phase{padding:20px 22px 8px 0;margin-right:22px;border-right:1px solid var(--line)}
.phase:last-child{border-right:0;margin-right:0}
.phase .when{font:700 22px/1.1 "Philosopher",serif;color:var(--choco);margin-bottom:14px}
.phase dl{display:grid;gap:12px}
.phase dt{font:600 10px/1.5 "Josefin Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
.phase dd{font-size:14.5px}
.equation{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;padding:26px 0;border-top:2px solid var(--choco);border-bottom:1px solid var(--line)}
.equation .t{display:flex;flex-direction:column}
.equation .t b{font:700 52px/1 "Philosopher",serif;color:var(--choco)}
.equation .t span{font:600 10px/1.6 "Josefin Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.equation .op{font:400 40px/1 "Philosopher",serif;color:var(--amber)}
.equation .t.res b{color:var(--orange)}

/* ═════════ KOL/KOC: tường creator & bước ═════════ */
.flow{display:grid;grid-template-columns:repeat(3,1fr);align-items:stretch;gap:0;border:1px solid var(--grey)}
.flow > div{padding:22px 24px;position:relative;border-right:1px solid var(--grey)}
.flow > div:last-child{border-right:0}
.flow > div:not(:last-child):after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px;z-index:1}
.flow b{display:block;font:700 40px/1 "Philosopher",serif;color:var(--choco);margin-bottom:8px}
.flow span{font-weight:600;color:var(--choco)}
.flow p{font-size:13.5px;color:var(--muted);margin-top:6px}
.steps{list-style:none;position:relative;display:grid;gap:0}
.steps:before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:2px;background:var(--grey)}
.steps li{position:relative;display:grid;grid-template-columns:150px 1fr 1fr;gap:24px;padding:16px 0 16px 44px;border-bottom:1px solid var(--line)}

</style>
<div id="app"></div>
<div id="editbar" hidden>
  <button class="eb-start" type="button">✎ Sửa nội dung</button>
  <div class="eb-panel" role="dialog" aria-label="Sửa nội dung">
    <div class="eb-title">Đang sửa nội dung <i>Chưa lưu</i></div>
    <div class="eb-status"></div>
    <label for="ebNote">Ghi chú cho Claude</label>
    <textarea id="ebNote" placeholder="Ví dụ: đổi thứ tự mục, thêm bảng, chỗ nào cần Claude làm giúp…"></textarea>
    <div class="eb-row"><button class="eb-cancel" type="button">Huỷ</button><button class="eb-save" type="button">Lưu</button></div>
  </div>
</div>
<script>
(() => {
  const app = document.getElementById('app');
  const $ = s => document.querySelector(s);
  let DATA = null, cur = 'index', drafts = {}, editing = false, artifact = null, assets = null;

  // ── Hiển thị trang theo #hash ──
  function pageFromHash() { const h = decodeURIComponent(location.hash.slice(1)); return DATA && DATA.pages[h] ? h : 'index'; }
  function render(name, keepScroll) {
    if (editing && cur) drafts[cur] = clean(app);
    cur = name;
    app.innerHTML = drafts[name] ?? DATA.pages[name];
    document.title = (DATA.titles && DATA.titles[name]) || 'Booming Ninemila';
    if (!keepScroll) window.scrollTo(0, 0);
    initToc();
    if (editing) setEditable(true);
  }
  window.addEventListener('hashchange', () => DATA && render(pageFromHash()));

  // ── Tương tác chung (gắn một lần, ủy quyền sự kiện) ──
  document.addEventListener('click', e => {
    const mb = e.target.closest('.menu > button');
    if (mb) { e.stopPropagation(); mb.parentNode.classList.toggle('open'); return; }
    document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
    const g = e.target.closest('[data-goto]');
    if (g) { e.preventDefault(); document.getElementById(g.dataset.goto)?.scrollIntoView({behavior: 'smooth'}); return; }
    const chip = e.target.closest('#matrixChips .chip');
    if (chip && !editing) {
      chip.parentNode.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === chip));
      document.querySelectorAll('#matrix tbody tr').forEach(r => r.classList.toggle('hide', chip.dataset.g !== 'all' && r.dataset.g !== chip.dataset.g));
      return;
    }
    if (editing) {
      const slot = e.target.closest('.slot');
      if (slot && app.contains(slot)) { e.preventDefault(); if (e.target.closest('.slot-del')) removeImg(slot); else pickImage(slot); return; }
      const a = e.target.closest('a');
      if (a && app.contains(a) && !a.closest('.menu-list') && !a.closest('.pager')) e.preventDefault();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); });
  let io;
  function initToc() {
    io?.disconnect();
    const links = [...app.querySelectorAll('.toc a[data-goto]')]; if (!links.length || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.dataset.goto === en.target.id)); }), { rootMargin: '-20% 0px -70% 0px' });
    app.querySelectorAll('.content section[id]').forEach(s => io.observe(s));
  }

  // ── Chế độ sửa ──
  const LOCK = '.menu, .top nav, .slot, .chips, .go, .toc, .stack';
  function setEditable(on) {
    app.contentEditable = on ? 'true' : 'false';
    app.querySelectorAll(LOCK).forEach(el => el.contentEditable = on ? 'false' : 'inherit');
    app.querySelectorAll('.slot').forEach(s => {
      s.querySelector('.slot-tools')?.remove();
      if (on) s.insertAdjacentHTML('beforeend', '<div class="slot-tools"><span>Bấm để tải ảnh</span>' + (s.classList.contains('has-img') ? '<button type="button" class="slot-del">Xoá ảnh</button>' : '') + '</div>');
    });
    document.body.classList.toggle('editing', on);
  }
  function clean(root) {
    const c = root.cloneNode(true);
    c.querySelectorAll('.slot-tools').forEach(x => x.remove());
    c.querySelectorAll('[contenteditable]').forEach(x => x.removeAttribute('contenteditable'));
    c.querySelectorAll('.menu.open').forEach(x => x.classList.remove('open'));
    c.querySelectorAll('.toc a.on').forEach(x => x.classList.remove('on'));
    c.querySelectorAll('tr.hide').forEach(x => x.classList.remove('hide'));
    return c.innerHTML;
  }
  const fileInput = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*', hidden: true });
  document.body.appendChild(fileInput);
  let pendingSlot = null;
  function pickImage(slot) {
    if (!assets) { status('Không tải ảnh được ở chế độ xem này.'); return; }
    pendingSlot = slot; fileInput.value = ''; fileInput.click();
  }
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0], slot = pendingSlot; if (!f || !slot) return;
    if (f.size > 20 * 1024 * 1024) { status('Ảnh quá 20 MB, chọn ảnh nhỏ hơn.'); return; }
    status('Đang tải ảnh lên…');
    try {
      const r = await assets.upload(f);
      slot.querySelector('img')?.remove();
      const im = document.createElement('img'); im.src = r.url; im.alt = slot.getAttribute('aria-label') || ''; im.dataset.asset = r.id;
      slot.prepend(im); slot.classList.add('has-img'); setEditable(true); dirty();
      status('Đã gắn ảnh. Bấm Lưu để giữ lại.');
    } catch (e) { status('Tải ảnh không thành công (' + (e.code || 'lỗi') + '). Thử lại với ảnh khác.'); }
  });
  function removeImg(slot) { slot.querySelector('img')?.remove(); slot.classList.remove('has-img'); setEditable(true); dirty(); status('Đã xoá ảnh khỏi khung. Bấm Lưu để giữ lại.'); }

  // ── Thanh công cụ ──
  const bar = document.getElementById('editbar');
  function status(t) { bar.querySelector('.eb-status').textContent = t; }
  let changed = false;
  function dirty() { changed = true; bar.classList.add('dirty'); }
  app.addEventListener('input', () => editing && dirty());
  bar.querySelector('.eb-start').onclick = () => { editing = true; drafts = {}; changed = false; bar.classList.add('open'); bar.querySelector('#ebNote').value = DATA.note || ''; setEditable(true); status('Bấm vào chữ để sửa, bấm khung ảnh để tải ảnh. Chuyển trang bằng menu "Các kế hoạch", phần đã sửa vẫn được giữ.'); };
  bar.querySelector('.eb-cancel').onclick = () => { editing = false; drafts = {}; changed = false; bar.classList.remove('open', 'dirty'); setEditable(false); render(cur, true); };
  bar.querySelector('#ebNote').addEventListener('input', dirty);
  bar.querySelector('.eb-save').onclick = async () => {
    drafts[cur] = clean(app);
    const next = { ...DATA, pages: { ...DATA.pages, ...drafts }, note: bar.querySelector('#ebNote').value, updated: new Date().toISOString() };
    const btn = bar.querySelector('.eb-save'); btn.disabled = true; status('Đang lưu…');
    try {
      await artifact.publish({ 'noidung.json': { content: JSON.stringify(next), contentType: 'application/json' } });
      DATA = next; drafts = {}; changed = false; bar.classList.remove('dirty');
      status('Đã lưu ' + new Date().toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'}) + '. Người khác mở link sẽ thấy bản mới.');
    } catch (e) {
      const m = { conflict: 'Có người vừa lưu bản khác, trang đang tải lại bản mới nhất.', not_writer: 'Tài khoản này chỉ được xem, không lưu được.', not_granted: 'Tài khoản này chỉ được xem, không lưu được.', too_large: 'Nội dung quá lớn để lưu.', rate_limited: 'Lưu quá nhanh, đợi vài giây rồi bấm Lưu lại.' };
      status(m[e.code] || 'Chưa lưu được (' + (e.code || 'lỗi') + '). Thử bấm Lưu lại.');
    } finally { btn.disabled = false; }
  };
  window.addEventListener('beforeunload', e => { if (editing && changed) { e.preventDefault(); e.returnValue = ''; } });

  // ── Khởi động ──
  (async () => {
    try { DATA = await fetch('noidung.json', { cache: 'no-store' }).then(r => r.json()); }
    catch (e) { app.innerHTML = '<p style="padding:40px">Không tải được nội dung (noidung.json).</p>'; return; }
    render(pageFromHash());
    if (window.claude?.use) {
      artifact = await window.claude.use('artifact');
      assets = await window.claude.use('assets');
      if (artifact) bar.hidden = false;
    }
  })();
})();
</script>
